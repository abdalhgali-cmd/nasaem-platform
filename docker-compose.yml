services:
  postgres:
    image: postgres:16-alpine
    container_name: nasaem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasaem_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasaem_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nasaem_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    # prisma migrate deploy applies the committed migrations in
    # backend/prisma/migrations/ — it does NOT create/edit migrations,
    # so it's safe to run on every container start.
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data:
