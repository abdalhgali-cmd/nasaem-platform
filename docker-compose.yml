services:
  postgres:
    image: postgres:16-alpine
    container_name: nasaem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasaem_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: nasaem_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    command: sh -c "npx prisma generate && npm run dev"

volumes:
  postgres_data:
