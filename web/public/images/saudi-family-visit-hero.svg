<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sfvSky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4EEF9"/>
      <stop offset="0.5" stop-color="#F7E9D2"/>
      <stop offset="1" stop-color="#D9AE6E"/>
    </linearGradient>
    <linearGradient id="sfvSand" x1="800" y1="540" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCB679"/>
      <stop offset="1" stop-color="#A67A3E"/>
    </linearGradient>
    <linearGradient id="sfvCityFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6B6A68" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#6B6A68" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#494A4A" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sfvBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sfvSky)"/>
  <circle cx="1180" cy="220" r="88" fill="#FFF6DC" fill-opacity="0.75" filter="url(#sfvBlur)"/>

  <!-- generic modern desert-city skyline, stylized and non-specific -->
  <g opacity="0.6">
    <rect x="1080" y="410" width="42" height="160" rx="4" fill="#7B7873"/>
    <rect x="1132" y="370" width="58" height="200" rx="4" fill="#6C6965"/>
    <rect x="1198" y="440" width="50" height="130" rx="4" fill="#807C76"/>
    <rect x="1258" y="400" width="70" height="170" rx="4" fill="#66635F"/>
    <rect x="1338" y="450" width="48" height="120" rx="4" fill="#7E7A75"/>
    <path d="M1250 570H1450V596H1250V570Z" fill="url(#sfvCityFade)"/>
  </g>

  <!-- desert dunes -->
  <path d="M0 570C260 520 500 532 730 560C940 586 1160 618 1600 574V900H0V570Z" fill="url(#sfvSand)"/>

  <!-- date palms, stylized -->
  <g fill="#3E6B3A">
    <path d="M230 560C230 560 205 520 170 512C205 522 224 540 230 552V560Z"/>
    <path d="M230 560C230 560 262 514 300 502C262 518 240 540 230 552V560Z"/>
    <path d="M230 560C230 560 214 508 220 470C232 505 234 535 230 552V560Z"/>
    <path d="M230 560C230 560 250 512 288 500C255 516 236 538 230 552V560Z"/>
  </g>
  <rect x="222" y="558" width="16" height="120" rx="4" fill="#8A6A3C"/>

  <g fill="#3E6B3A">
    <path d="M1010 600C1010 600 990 566 962 558C990 568 1004 584 1010 594V600Z"/>
    <path d="M1010 600C1010 600 1036 562 1068 552C1036 566 1018 584 1010 594V600Z"/>
    <path d="M1010 600C1010 600 1050 566 1082 560C1050 574 1024 588 1010 594V600Z"/>
  </g>
  <rect x="1002" y="598" width="14" height="100" rx="4" fill="#8A6A3C"/>

  <!-- family silhouette: two adults + child, holding hands, with a travel bag -->
  <g fill="#4A4744">
    <circle cx="470" cy="640" r="20"/>
    <path d="M440 700C440 668 452 654 470 654C488 654 500 668 500 700V732H440V700Z"/>
    <circle cx="524" cy="654" r="15"/>
    <path d="M500 700C500 676 511 664 524 664C537 664 548 676 548 700V732H500V700Z"/>
    <circle cx="412" cy="636" r="18"/>
    <path d="M386 700C386 670 397 656 412 656C427 656 438 670 438 700V732H386V700Z"/>
  </g>
  <rect x="352" y="700" width="26" height="32" rx="4" fill="#8A6A3C"/>

  <!-- passport / boarding pass motif -->
  <g transform="translate(1140 680)">
    <rect width="120" height="84" rx="8" fill="#0B3D91"/>
    <rect x="10" y="14" width="100" height="8" rx="4" fill="#D4AF37" fill-opacity="0.85"/>
    <rect x="10" y="32" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="10" y="46" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.4"/>
    <circle cx="95" cy="60" r="12" fill="#D4AF37" fill-opacity="0.5"/>
  </g>

  <!-- Saudi green accent ribbon — a color cue only, no flag composition, no script/emblem -->
  <g transform="translate(72 82)">
    <rect width="224" height="24" rx="12" fill="#006C35"/>
    <rect y="30" width="224" height="24" rx="12" fill="#F7F7F7" stroke="#E4E4E4" stroke-width="1"/>
  </g>

  <!-- warm haze -->
  <rect width="1600" height="900" fill="#FFF4D8" fill-opacity="0.08"/>
