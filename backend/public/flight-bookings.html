<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>طلبات حجز الطيران — نسائم الحرمين</title><link rel="stylesheet" href="/assets/style.css"/></head>
<body><header class="app-header" id="app-header"></header><main>
<div id="alert"></div>
<section class="card"><div class="stack" style="justify-content:space-between;align-items:center"><div><h1 style="margin:0">✈️ طلبات حجز الطيران</h1><p class="muted">إدارة الحجز المبدئي، إشعارات الدفع، والتذكرة النهائية.</p></div><a class="btn secondary" href="/admin-dashboard.html" style="text-decoration:none">العودة للوحة التحكم</a></div></section>
<section class="card"><div class="stack" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">الحجوزات</h2><p class="muted">اختر الحالة لعرض الطلبات التي تحتاج إجراءً.</p></div><select id="status" style="max-width:280px"><option value="">كل الحالات</option><option value="REQUESTED">طلبات جديدة</option><option value="PROVISIONAL_TICKET">الحجز المبدئي</option><option value="PAYMENT_PENDING">بانتظار الدفع</option><option value="PAYMENT_UNDER_REVIEW">إشعار الدفع قيد المراجعة</option><option value="PAYMENT_CONFIRMED">تم تأكيد الدفع</option><option value="FINAL_TICKET_ISSUED">الحجز النهائي</option></select></div><div style="overflow:auto;margin-top:16px"><table><thead><tr><th>رقم الحجز</th><th>العميل</th><th>الهاتف</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section>
<section class="card" id="details" style="display:none"></section>
</main>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertMsg(m,e=false){$('alert').innerHTML=`<div class="card" style="border-color:${e?'#b91c1c':'#15803d'}"><strong>${esc(m)}</strong></div>`}
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.message||`HTTP ${r.status}`);return d}
function label(s){return ({REQUESTED:'تم استلام الطلب',RESERVATION_PENDING:'جاري الحجز المبدئي',PROVISIONAL_TICKET:'تم إصدار الحجز المبدئي',PAYMENT_PENDING:'بانتظار الدفع',PAYMENT_UNDER_REVIEW:'إشعار الدفع قيد المراجعة',PAYMENT_CONFIRMED:'تم تأكيد الدفع',FINAL_TICKET_ISSUED:'تم إصدار الحجز النهائي',CANCELLED:'ملغي'})[s]||s}
async function load(){try{const q=$('status').value;const d=await api('/api/flight-bookings/admin/list'+(q?'?status='+encodeURIComponent(q):''));$('body').innerHTML=(d.bookings||[]).map(b=>`<tr><td><strong>${esc(b.booking_number)}</strong></td><td>${esc(b.customer_name)}</td><td>${esc(b.customer_phone||'—')}</td><td>${Number(b.amount).toLocaleString()} ${esc(b.currency)}</td><td>${esc(b.statusLabel||label(b.status))}</td><td>${new Date(b.created_at).toLocaleString('ar-SD')}</td><td><button class="btn secondary" onclick="openBooking('${esc(b.id)}')">فتح</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد طلبات.</td></tr>'}catch(e){alertMsg(e.message,true)}}
window.openBooking=async id=>{try{const d=await api('/api/flight-bookings/'+id);const b=d.booking;$('details').style.display='block';$('details').innerHTML=`<div class="stack" style="justify-content:space-between"><div><h2 style="margin:0">الحجز ${esc(b.booking_number)}</h2><p class="muted">${esc(b.customer_name)} · ${esc(b.customer_phone||'')}</p></div><button class="btn secondary" onclick="$('details').style.display='none'">إغلاق</button></div><hr/><div class="grid cols-3"><div><strong>الحالة</strong><p>${esc(b.statusLabel)}</p></div><div><strong>المبلغ</strong><p>${Number(b.amount).toLocaleString()} ${esc(b.currency)}</p></div><div><strong>تاريخ الطلب</strong><p>${new Date(b.created_at).toLocaleString('ar-SD')}</p></div></div><h3>إجراءات الموظف</h3><div id="actions" class="stack"></div>`;renderActions(b)}catch(e){alertMsg(e.message,true)}}
function renderActions(b){const a=$('actions');let h='';if(b.status==='REQUESTED'||b.status==='RESERVATION_PENDING')h+=`<form onsubmit="uploadFile(event,'${b.id}','provisional')"><label>رفع الحجز/التذكرة المبدئية</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required/><button class="btn" type="submit">إرسال للعميل</button></form>`;if(b.provisional_ticket_path)h+=`<a class="btn secondary" href="/api/flight-bookings/${b.id}/file/provisional" target="_blank">عرض الحجز المبدئي</a>`;if(b.status==='PAYMENT_UNDER_REVIEW'){h+=`<a class="btn secondary" href="/api/flight-bookings/${b.id}/file/receipt" target="_blank">عرض إشعار الدفع</a><form onsubmit="confirmPay(event,'${b.id}')"><textarea name="note" placeholder="ملاحظة التحقق من الدفع (اختياري)"></textarea><button class="btn" type="submit">تأكيد الدفع</button></form>`}if(b.status==='PAYMENT_CONFIRMED')h+=`<form onsubmit="uploadFile(event,'${b.id}','final')"><label>رفع التذكرة النهائية</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required/><button class="btn" type="submit">إصدار الحجز النهائي</button></form>`;if(b.payment_receipt_path&&b.status!=='PAYMENT_UNDER_REVIEW')h+=`<a class="btn secondary" href="/api/flight-bookings/${b.id}/file/receipt" target="_blank">عرض إشعار الدفع</a>`;if(b.final_ticket_path)h+=`<a class="btn secondary" href="/api/flight-bookings/${b.id}/file/final" target="_blank">عرض التذكرة النهائية</a>`;a.innerHTML=h||'<p class="muted">لا توجد إجراءات مطلوبة لهذه الحالة.</p>'}
window.uploadFile=async(e,id,kind)=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/flight-bookings/'+id+'/'+(kind==='provisional'?'provisional-ticket':'final-ticket'),{method:'POST',body:f});alertMsg(kind==='provisional'?'تم رفع الحجز المبدئي وإتاحته للعميل.':'تم إصدار الحجز النهائي بنجاح.');await load();await openBooking(id)}catch(x){alertMsg(x.message,true)}};
window.confirmPay=async(e,id)=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/flight-bookings/'+id+'/confirm-payment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({note:f.get('note')||''})});alertMsg('تم تأكيد الدفع.');await load();await openBooking(id)}catch(x){alertMsg(x.message,true)}};
$('status').onchange=load;load();
</script></body></html>
