<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>طلبات حجز الطيران — نسائم الحرمين</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="app-header" id="app-header"></header>
  <main>
    <div id="alert" aria-live="polite"></div>
    <section class="card">
      <div class="stack wrap" style="justify-content: space-between; align-items: center">
        <div>
          <h1 style="margin: 0">طلبات حجز الطيران</h1>
          <p class="muted">الحجز المبدئي، مراجعة إشعار الدفع، والتذكرة النهائية.</p>
        </div>
        <a class="btn secondary" href="/admin-dashboard.html">العودة للوحة التحكم</a>
      </div>
    </section>
    <section class="card">
      <div class="filters">
        <div class="field">
          <label for="flight-search">بحث</label>
          <input id="flight-search" type="search" placeholder="رقم الحجز أو الاسم أو الهاتف" />
        </div>
        <div class="field">
          <label for="flight-status-filter">الحالة</label>
          <select id="flight-status-filter">
            <option value="">كل الحالات</option>
            <option value="REQUESTED">طلبات جديدة</option>
            <option value="PAYMENT_PENDING">بانتظار الدفع</option>
            <option value="PAYMENT_UNDER_REVIEW">إشعار الدفع قيد المراجعة</option>
            <option value="PAYMENT_CONFIRMED">تم تأكيد الدفع</option>
            <option value="FINAL_TICKET_ISSUED">الحجز النهائي</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>رقم الحجز</th><th>العميل</th><th>المبلغ</th><th>الحالة</th><th>الإجراء التالي</th><th>التاريخ</th></tr></thead>
          <tbody id="flight-bookings-body"></tbody>
        </table>
      </div>
    </section>
    <section class="card hidden" id="flight-booking-detail" aria-live="polite"></section>
  </main>
  <script src="/assets/api.js"></script>
  <script src="/assets/layout.js"></script>
  <script src="/assets/flight-bookings-view.js"></script>
  <script src="/assets/flight-bookings-page.js"></script>
</body>
</html>
