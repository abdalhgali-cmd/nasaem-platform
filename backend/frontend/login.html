<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — نسائم الحرمين</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h2>نسائم الحرمين</h2>
      <p class="muted">تسجيل دخول الموظفين</p>
      <div id="alert-box"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" id="submit-btn" style="width: 100%">دخول</button>
      </form>
      <p class="muted" style="margin-top: 10px">
        <a href="#" id="forgot-password-link">نسيت كلمة المرور؟</a>
      </p>

      <form id="reset-form" class="hidden">
        <div id="reset-alert"></div>
        <div class="field" id="reset-email-field">
          <label for="reset-email">البريد الإلكتروني</label>
          <input type="email" id="reset-email" autocomplete="username" />
        </div>
        <div class="field hidden" id="reset-code-field">
          <label for="reset-code">الرمز المُرسل عبر واتساب</label>
          <input type="text" id="reset-code" maxlength="6" autocomplete="one-time-code" />
        </div>
        <div class="field hidden" id="reset-password-field">
          <label for="reset-password">كلمة المرور الجديدة</label>
          <input type="password" id="reset-password" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn secondary" id="reset-submit-btn" style="width: 100%">إرسال الرمز</button>
        <p class="muted" style="margin-top: 10px">
          <a href="#" id="back-to-login-link">العودة لتسجيل الدخول</a>
        </p>
      </form>
    </div>
  </div>

  <script src="/assets/api.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
