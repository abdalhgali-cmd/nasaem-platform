<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061f42">
  <title>نسائم الحرمين</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/design-integrated.css">
</head>
<body>
  <div class="status-scrim" aria-hidden="true"></div>
  <div id="offlineBanner" class="offline-banner">لا يوجد اتصال بالإنترنت — بعض البيانات قد تكون قديمة</div>

  <main class="app-shell">
    <div id="screen" class="screen"></div>

    <nav id="bottomNav" class="bottom-nav" hidden>
      <span class="nav-indicator" aria-hidden="true"></span>
      <button data-tab="home" class="active" aria-label="الرئيسية">
        <span class="nav-icon" data-icon="home"></span>
        <span>الرئيسية</span>
      </button>
      <button data-tab="services" aria-label="ابدأ طلبًا جديدًا">
        <span class="nav-icon" data-icon="globe"></span>
        <span>ابدأ طلب</span>
      </button>
      <button data-tab="requests" aria-label="متابعة الطلبات">
        <span class="nav-icon" data-icon="requests"></span>
        <span>متابعة</span>
      </button>
      <button data-tab="account" aria-label="الحساب والمزيد">
        <span class="nav-icon" data-icon="user"></span>
        <span>المزيد</span>
      </button>
    </nav>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/icons-bootstrap.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
