apply plugin: 'com.android.application'

android {
    namespace = "com.nasaemalharamain.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nasaemalharamain.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridden by the build (-Pandroid.injected.version.code/name): the
        // release workflow sets a versionCode that only ever increases.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two signing identities, never mixed up:
    //  - release: the agency's own, permanent key, supplied ONLY through the
    //    environment by the release workflow (NASAEM_RELEASE_KEYSTORE = path to
    //    the decoded keystore, plus its passwords/alias). It is never committed.
    //    Every APK/AAB built with it is installable over the previous one,
    //    because package name and signing key stay the same and versionCode only
    //    goes up.
    //  - QA fallback: the committed, publicly known debug key, used by pull
    //    request builds so they stay installable. A build made with it is NOT a
    //    release; -PrequireReleaseKey=true (set by the release workflow) refuses
    //    to fall back to it.
    def releaseKeystore = System.getenv("NASAEM_RELEASE_KEYSTORE")
    if (!releaseKeystore && project.hasProperty("requireReleaseKey")) {
        throw new GradleException("NASAEM_RELEASE_KEYSTORE is not set: refusing to sign a release with the QA key.")
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("NASAEM_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("NASAEM_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("NASAEM_RELEASE_KEY_PASSWORD")
            } else {
                storeFile rootProject.file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // BiometricPrompt + Keystore-bound session key (SecureSessionPlugin).
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
