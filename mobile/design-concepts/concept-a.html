<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A · Modern Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* A — Modern Minimal: white canvas, navy ink, one gold hairline per screen. */
:root{
  --navy:#082b58; --navy-2:#0b417e; --gold:#d6aa4b; --gold-2:#b88a2a;
  --bg:#ffffff; --surface:#f4f6f9; --line:#e6e9ef; --ink:#0f1f3a; --muted:#6b7488;
  --f:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.ic{width:22px;height:22px;flex:none}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:0 20px 24px}
.fade{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
.fade.d2{animation-delay:.08s}.fade.d3{animation-delay:.16s}.fade.d4{animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* logo crop: hides the PNG frame */
.logo{overflow:hidden;display:block}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}

/* Welcome */
.w{flex:1;display:flex;flex-direction:column;padding:28px 24px 28px}
.w .logo{width:100%;aspect-ratio:2.3;margin-top:8vh}
.w h1{font-weight:600;font-size:22px;line-height:1.5;color:var(--navy);text-align:center;margin-top:18px;text-wrap:balance}
.w p{color:var(--muted);text-align:center;font-size:14px;margin-top:6px;font-weight:300}
.rule{width:36px;height:2px;background:var(--gold);border-radius:2px;margin:18px auto 0}
.actions{margin-top:auto;display:grid;gap:12px}
.btn{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:16px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.outline{border:1.5px solid var(--navy);color:var(--navy)}
.btn.ghost{color:var(--muted);height:46px;font-size:15px}
.btn.ghost .ic{width:18px;height:18px}
.legal{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;font-weight:300}

/* Returning (biometric prototype) */
.r{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 24px}
.r .mark{width:64px;height:64px;border-radius:50%;margin-top:6vh}
.r h2{font-weight:600;font-size:21px;color:var(--navy);margin-top:18px}
.r p{color:var(--muted);font-size:14px;margin-top:6px;font-weight:300}
.fp{margin:auto;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;color:var(--navy);position:relative;background:var(--surface)}
.fp .ic{width:58px;height:58px;stroke-width:1.3}
.fp::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--gold);opacity:.7;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.proto{font-size:11px;letter-spacing:.02em;color:var(--gold-2);border:1px solid var(--gold);border-radius:20px;padding:3px 10px}
.r .alt{display:grid;gap:8px;width:100%}

/* App chrome */
.top{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.top .mark{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}
.top .hello{flex:1;min-width:0}
.top .hello small{display:block;color:var(--muted);font-size:12.5px;font-weight:300}
.top .hello b{font-weight:600;font-size:17px;color:var(--navy)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--navy);background:var(--surface)}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--surface);padding:0 14px;color:var(--muted);font-size:14px;font-weight:300}
.search .ic{width:19px;height:19px}

.hero{margin-top:16px;border-radius:20px;padding:20px;border:1px solid var(--line);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto auto;width:4px;height:100%;background:var(--gold)}
.hero .ico{width:56px;height:56px;border-radius:16px;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.hero .ico .ic{width:28px;height:28px}
.hero h3{font-weight:600;font-size:17px;color:var(--navy)}
.hero p{font-size:13px;color:var(--muted);font-weight:300;margin-top:2px}
.hero .go{margin-inline-start:auto;color:var(--navy)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h4{font-weight:600;font-size:15px;color:var(--ink)}
.sec a{font-size:13px;color:var(--navy-2);text-decoration:none;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:16px;background:var(--surface);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;line-height:1.4;color:var(--ink);min-height:94px;transition:background .2s}
.tile:active{background:#e9edf3}
.tile .ic{color:var(--navy);width:24px;height:24px}
.empty{border:1px dashed #cfd5df;border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center}
.empty .ic{color:var(--gold-2)}
.empty b{display:block;font-weight:500;font-size:14px}
.empty small{color:var(--muted);font-size:12.5px;font-weight:300}
.empty .mini{margin-inline-start:auto;font-size:13px;color:#fff;background:var(--navy);border-radius:10px;padding:8px 12px;white-space:nowrap}

.nav{display:flex;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:#fff}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#98a0b0;padding:4px 0}
.nav button.on{color:var(--navy);font-weight:500}
.nav button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold)}

/* Services */
.head{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.head h2{font-weight:600;font-size:20px;color:var(--navy);flex:1}
.group h5{font-size:12.5px;color:var(--muted);font-weight:500;margin:22px 0 6px;letter-spacing:.01em}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .sq{width:44px;height:44px;border-radius:13px;background:var(--surface);display:grid;place-items:center;color:var(--navy)}
.row span{flex:1;font-size:15px;font-weight:400}
.row .chev{color:#b2b9c6;width:18px;height:18px}
</style>
</head>
<body>
<main id="app"></main>
<script src="shared.js"></script>
<script>
var I = N.icon;
function nav(on){return '<nav class="nav">'+N.tabs.map(function(t){return '<button class="'+(t.k===on?'on':'')+'" data-go="'+(t.k==='home'?'home':'home')+'">'+I(t.i)+t.n+'</button>'}).join('')+'</nav>'}
N.mount({
  welcome:function(){return '<section class="w">'+
    '<div class="logo fade"><img src="assets/logo-wide.png" alt="نسائم الحرمين للسفر والسياحة"></div>'+
    '<h1 class="fade d2">العمرة والسفر والتأشيرات في مكان واحد</h1>'+
    '<div class="rule fade d2"></div>'+
    '<div class="actions">'+
      '<button class="btn primary fade d3" data-go="returning">'+I('login')+'تسجيل الدخول</button>'+
      '<button class="btn outline fade d3">'+I('userPlus')+'إنشاء حساب</button>'+
      '<button class="btn ghost fade d4" data-go="home">الدخول كزائر '+I('fwd')+'</button>'+
    '</div></section>'},
  returning:function(){return '<section class="r">'+
    '<div class="mark logo fade"><img src="assets/logo-mark.png" alt=""></div>'+
    '<h2 class="fade d2">مرحبًا بعودتك</h2><p class="fade d2">معاينة لشكل الدخول بالبصمة — محاكاة</p>'+
    '<button class="fp fade d3" data-go="home" aria-label="الدخول بالبصمة">'+I('finger')+'</button>'+
    '<div class="alt"><p style="text-align:center;margin-bottom:6px">المس مستشعر البصمة للمتابعة</p>'+
    '<button class="btn ghost">'+I('lock')+'استخدام كلمة المرور</button>'+
    '<div style="text-align:center"><span class="proto">نموذج أولي — الواجهة فقط</span></div></div></section>'},
  home:function(){return '<header class="top fade"><div class="mark logo"><img src="assets/logo-mark.png" alt=""></div>'+
    '<div class="hello"><small>نسائم الحرمين</small><b>أهلًا بك</b></div>'+
    '<button class="iconbtn" aria-label="الإشعارات">'+I('bell')+'</button></header>'+
    '<div class="scroll">'+
    '<div class="search fade d2">'+I('search')+'ابحث عن خدمة</div>'+
    '<div class="hero fade d2"><div class="ico">'+I('kaaba')+'</div><div><h3>خدمات العمرة</h3><p>اطلب الخدمة وتابع طلبك</p></div><span class="go">'+I('fwd')+'</span></div>'+
    '<div class="sec fade d3"><h4>الخدمات</h4><a href="#services">عرض الكل</a></div>'+
    '<div class="tiles fade d3">'+['flight','hotel','ferry','family','egypt','tasheel'].map(function(k){var s=N.svc(k);return '<button class="tile" data-go="services">'+I(s.i)+s.n+'</button>'}).join('')+'</div>'+
    '<div class="sec fade d4"><h4>طلباتي</h4></div>'+
    '<div class="empty fade d4">'+I('list')+'<div><b>تتبّع طلباتك</b><small>سجّل الدخول لمتابعة حالة طلباتك</small></div><button class="mini" data-go="welcome">دخول</button></div>'+
    '</div>'+nav('home')},
  services:function(){return '<header class="head"><button class="iconbtn" data-go="home" aria-label="رجوع">'+I('back')+'</button><h2>كل الخدمات</h2></header>'+
    '<div class="scroll"><div class="search">'+I('search')+'ابحث عن خدمة</div>'+
    N.groups.map(function(g,gi){return '<div class="group fade d'+Math.min(gi+1,4)+'"><h5>'+g.n+'</h5>'+N.inGroup(g.k).map(function(s){return '<div class="row"><div class="sq">'+I(s.i)+'</div><span>'+s.n+'</span>'+I('chev','chev')+'</div>'}).join('')+'</div>'}).join('')+
    '</div>'+nav('home')}
});
</script>
</body>
</html>
