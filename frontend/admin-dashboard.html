<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم — نسائم الحرمين</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="app-header" id="app-header"></header>

  <main>
    <div id="page-alert"></div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="overview" class="active">نظرة عامة</button>
      <button type="button" data-tab="orders">الطلبات</button>
      <button type="button" data-tab="customers">العملاء</button>
      <button type="button" data-tab="payments">الدفعات</button>
    </div>

    <section id="tab-overview">
      <div class="stat-tiles" id="stat-tiles"></div>
      <div class="card">
        <h2>أحدث الطلبات</h2>
        <table>
          <thead>
            <tr><th>رقم الطلب</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>تاريخ الإنشاء</th></tr>
          </thead>
          <tbody id="latest-orders-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-orders" class="hidden">
      <div class="card">
        <div class="stack" style="justify-content: space-between; margin-bottom: 14px">
          <h2 style="margin: 0">الطلبات</h2>
          <div class="stack">
            <select id="order-status-filter">
              <option value="">كل الحالات</option>
              <option value="NEW">جديد</option>
              <option value="UNDER_REVIEW">قيد المراجعة</option>
              <option value="WAITING_DOCUMENTS">بانتظار المستندات</option>
              <option value="PAYMENT_PENDING">بانتظار الدفع</option>
              <option value="PROCESSING">قيد التنفيذ</option>
              <option value="APPROVED">معتمد</option>
              <option value="COMPLETED">مكتمل</option>
              <option value="REJECTED">مرفوض</option>
              <option value="CANCELLED">ملغي</option>
            </select>
            <a href="/request.html" class="btn secondary" style="text-decoration: none">+ طلب جديد</a>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>رقم الطلب</th><th>العميل</th><th>الحالة</th><th>الدفع</th><th>الإجمالي</th><th></th></tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
        <div class="pagination" id="orders-pagination"></div>
      </div>

      <div class="card hidden" id="order-detail-card"></div>
    </section>

    <section id="tab-customers" class="hidden">
      <div class="card">
        <div class="stack" style="justify-content: space-between; margin-bottom: 14px">
          <h2 style="margin: 0">العملاء</h2>
          <input type="search" id="customer-search" placeholder="بحث بالاسم أو رقم الجواز..." style="max-width: 260px" />
        </div>
        <table>
          <thead>
            <tr><th>رقم العميل</th><th>الاسم</th><th>رقم الجواز</th><th>الجنسية</th><th>الهاتف</th></tr>
          </thead>
          <tbody id="customers-body"></tbody>
        </table>
        <div class="pagination" id="customers-pagination"></div>
      </div>
    </section>

    <section id="tab-payments" class="hidden">
      <div class="card">
        <h2>الدفعات</h2>
        <table>
          <thead>
            <tr><th>رقم الطلب</th><th>العميل</th><th>المبلغ</th><th>طريقة الدفع</th><th>الحالة</th><th>التاريخ</th></tr>
          </thead>
          <tbody id="payments-body"></tbody>
        </table>
        <div class="pagination" id="payments-pagination"></div>
      </div>
    </section>
  </main>

  <script src="/assets/api.js"></script>
  <script src="/assets/layout.js"></script>
  <script src="/assets/admin-dashboard.js"></script>
</body>
</html>
