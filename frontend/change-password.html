<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تغيير كلمة المرور — نسائم الحرمين</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="app-header" id="app-header"></header>

  <main>
    <div id="page-alert"></div>

    <section class="card" style="max-width: 420px">
      <h2>تغيير كلمة المرور</h2>
      <form id="change-password-form">
        <div class="field">
          <label for="cp-current">كلمة المرور الحالية *</label>
          <input id="cp-current" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="cp-new">كلمة المرور الجديدة *</label>
          <input id="cp-new" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="cp-confirm">تأكيد كلمة المرور الجديدة *</label>
          <input id="cp-confirm" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div id="cp-alert"></div>
        <button type="submit" class="btn" id="cp-submit-btn">حفظ كلمة المرور الجديدة</button>
      </form>
    </section>
  </main>

  <script src="/assets/api.js"></script>
  <script src="/assets/layout.js"></script>
  <script src="/assets/change-password.js"></script>
</body>
</html>
