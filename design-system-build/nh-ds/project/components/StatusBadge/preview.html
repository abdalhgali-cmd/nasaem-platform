<div class="nh" dir="rtl" lang="ar" style="padding:24px;background:var(--canvas);min-height:100%">
<div style="display:grid;gap:12px;">
<div class="nh-muted" style="font-size:12px;font-weight:700;line-height:18px">حالات الطلب (statusLabel)</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;"><span class="nh-badge nh-badge--info">جديد</span><span class="nh-badge nh-badge--info">قيد المراجعة</span><span class="nh-badge nh-badge--warning">بانتظار المستندات</span><span class="nh-badge nh-badge--warning">بانتظار الدفع</span><span class="nh-badge nh-badge--navy">قيد التنفيذ</span><span class="nh-badge nh-badge--success">معتمد</span><span class="nh-badge nh-badge--success">مكتمل</span><span class="nh-badge nh-badge--danger">مرفوض</span><span class="nh-badge">ملغي</span></div>
<div class="nh-muted" style="font-size:12px;font-weight:700;line-height:18px">حالة الدفع</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;"><span class="nh-badge nh-badge--danger">غير مدفوع</span><span class="nh-badge nh-badge--warning">جزئي</span><span class="nh-badge nh-badge--warning">بانتظار التحويل</span><span class="nh-badge nh-badge--info">الدفع قيد المراجعة</span><span class="nh-badge nh-badge--success">مدفوع</span></div>
<div class="nh-muted" style="font-size:12px;font-weight:700;line-height:18px">نوع الخدمة</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;"><span class="nh-badge nh-badge--nile nh-badge--square"><i data-icon="shield-check"></i>الموافقة الأمنية لمصر</span><span class="nh-badge nh-badge--gold nh-badge--square"><i data-icon="sparkles"></i>عمرة</span><span class="nh-badge nh-badge--navy nh-badge--square"><i data-icon="plane"></i>طيران</span><span class="nh-badge nh-badge--navy nh-badge--square"><i data-icon="hotel"></i>فنادق</span></div>
<div class="nh-muted" style="font-size:12px;font-weight:700;line-height:18px">مؤشر SLA</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;"><span class="nh-sla nh-sla--ok"><i data-icon="circle-check"></i>ضمن الموعد</span><span class="nh-sla nh-sla--due"><i data-icon="clock"></i>تستحق اليوم</span><span class="nh-sla nh-sla--late"><i data-icon="triangle-alert"></i>متأخرة ٢ يوم</span></div>
</div>
</div>
<script>window.NasaemDS && NasaemDS.hydrate();</script>
