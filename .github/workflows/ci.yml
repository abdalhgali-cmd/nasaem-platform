name: CI

on:
  push:
    branches: [main, feature/flights-booking-phase2, feature/platform-3-admin-controlled]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nasaem_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/nasaem_platform_test?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      SEED_ADMIN_PASSWORD: CiTest@12345

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npm run prisma:seed
      # Runs migrationIntegrity.test.js as part of the suite — the same
      # guard against a future migration silently dropping the flight_*
      # raw-SQL tables that this session's Phase 19 work re-verified.
      - name: Run tests
        run: npm test

  web:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      # getPublicHomepage()/getPublicTheme()/getSiteAssetUrls() (web/src/lib)
      # never throw — a build with no backend reachable still succeeds,
      # falling back to bundled defaults, so this job needs no database or
      # running backend.
      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nasaem_platform_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@localhost:5432/nasaem_platform_dev?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      SEED_ADMIN_PASSWORD: CiTest@12345
      # The suite exercises many public catalog calls from one runner IP;
      # this CI-only override avoids cross-test 429s while Production keeps
      # the backend default of 200 requests per IP.
      API_RATE_LIMIT: 2000
      # Deliberately NOT setting PORT here: backend/src/server.js already
      # defaults to 5000 without it, and `next dev` also reads PORT — a
      # job-wide PORT=5000 was found (during this exact CI verification)
      # to make Next.js bind port 5000 too, colliding with where
      # playwright.config.ts's webServer expects the backend to be and
      # leaving nothing listening on port 3000 for web/.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed database
        working-directory: backend
        run: npm run prisma:seed

      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer array starts both the backend
      # (`npm run start` in ../backend, using this job's DATABASE_URL) and
      # the web dev server itself — no separate "start the app" step
      # needed here.
      - name: Run Playwright E2E suite
        working-directory: web
        run: npx playwright test --project=mobile-web --project=mobile-frontend --project=platform3

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
