name: NASAEM Combined PR Dry-run

on:
  pull_request:
    branches: [claude/release-integration]
    paths:
      - ".github/workflows/nasaem-combined-dryrun.yml"

permissions:
  contents: read

jobs:
  integration:
    name: Combine PRs and run full local CI
    runs-on: ubuntu-latest
    timeout-minutes: 95
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nasaem_platform_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/nasaem_platform_dev?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 7d
      SEED_ADMIN_PASSWORD: CiTest@12345
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081
      API_RATE_LIMIT: 2000
      PUBLIC_CONTACT_RATE_LIMIT: 80
      TRACKING_CODE_RATE_LIMIT: 30
      NODE_ENV: development
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge feature branches locally only (never push)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NASAEM Integration Check'
          git config user.email 'ci@users.noreply.github.com'
          git fetch --no-tags origin 'refs/heads/claude/release-integration:refs/remotes/origin/claude/release-integration'
          PRS=(111 115 112 113 116 117 118 114)
          for pr in "${PRS[@]}"; do
            git fetch --no-tags origin "+refs/pull/$pr/head:refs/remotes/test-pr/$pr"
          done
          echo '### Pairwise feature-branch conflict scan' >> "$GITHUB_STEP_SUMMARY"
          conflicts=0
          for ((i=0; i<${#PRS[@]}; i++)); do
            for ((j=i+1; j<${#PRS[@]}; j++)); do
              left="${PRS[$i]}"
              right="${PRS[$j]}"
              if git merge-tree --write-tree --name-only "refs/remotes/test-pr/$left" "refs/remotes/test-pr/$right" > /tmp/nasaem-pair.log 2>&1; then
                :
              else
                conflicts=$((conflicts + 1))
                echo "- PR #$left + #$right: conflict" >> "$GITHUB_STEP_SUMMARY"
                sed -n '2,14p' /tmp/nasaem-pair.log | grep -E '^(TASKS\\.md|backend/|web/|mobile/)' | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY" || true
                echo "Pair conflict: #$left + #$right"
                cat /tmp/nasaem-pair.log | head -25
              fi
            done
          done
          echo "Pairwise incompatible combinations: $conflicts" >> "$GITHUB_STEP_SUMMARY"
          base="$(git rev-parse refs/remotes/origin/claude/release-integration)"
          git switch -C combined-local "$base"
          echo '### Combined PR merge compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo "Base: \`$base\` (integration branch). Runner-only merge, never pushed." >> "$GITHUB_STEP_SUMMARY"
          for pr in "${PRS[@]}"; do
            echo "Attempting PR #$pr"
            if git merge --no-ff --no-edit "refs/remotes/test-pr/$pr"; then
              echo "- PR #$pr: merge clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Git merge conflict while combining PR #$pr"
              printf '%s\n' 'Unmerged files:'
              git diff --name-only --diff-filter=U
              echo "- PR #$pr: CONFLICT (stop; no tests run)" >> "$GITHUB_STEP_SUMMARY"
              echo '#### Unmerged files' >> "$GITHUB_STEP_SUMMARY"
              git diff --name-only --diff-filter=U | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo 'All eight PRs merge cleanly; starting combined test suite.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend install and migrations
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Backend full test suite
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm test
      - name: Reset disposable test database for browser tests
        working-directory: backend
        run: |
          npx prisma migrate reset --force --skip-seed
          npm run prisma:seed
      - name: Web typecheck, lint, production build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          NODE_ENV=production npm run build
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Combined browser and mobile emulation E2E
        working-directory: web
        run: npx playwright test --project=mobile-web --project=mobile-frontend --project=platform3 --project=mobile-app
      - name: Save failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combined-playwright-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
