name: Production CORS read-only probe
# One-off, read-only: which candidate origins does the production API allow?
# GET only, public endpoint, no credentials, no secrets.
on:
  push:
    branches: [probe/production-cors-readonly-20261115]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      API: https://nasaem-platform-production.up.railway.app/api
    steps:
      - name: Allowed origins among candidates
        run: |
          for O in https://nasaem-website-production.up.railway.app https://nasaem-alharamain.com https://www.nasaem-alharamain.com http://nasaem-alharamain.com \
            https://nasaem-platform-production.up.railway.app https://nasaem-website-staging-staging.up.railway.app https://adaptable-quietude-staging.up.railway.app \
            https://nasaem-platform.vercel.app https://nasaem-alharamain.vercel.app https://nasaem.vercel.app https://nasaem-website.vercel.app https://web-nasaem.vercel.app \
            http://localhost:3000 http://localhost:8081 http://localhost:5000 http://localhost https://localhost capacitor://localhost ionic://localhost \
            https://api.nasaem-alharamain.com https://admin.nasaem-alharamain.com https://app.nasaem-alharamain.com https://evil.example; do
            A=$(curl -sS -m 30 -o /dev/null -D - -H "Origin: $O" "$API/health" | grep -i "^access-control-allow-origin" | tr -d '\r' || true)
            printf "%-62s → %s\n" "$O" "${A:-NOT ALLOWED}"
          done
