name: Launch readiness read-only probe
# Read-only facts for the 2026-11-20 launch review. GET only, except one
# tracking-code request with a synthetic number that the API answers before
# writing anything when no channel is configured (OTP_CHANNEL_UNAVAILABLE).
# No credentials, no secrets, no customer data.
on:
  push:
    branches: [probe/production-cors-readonly-20261115]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIs (production, QA, staging)
        run: |
          for API in https://nasaem-platform-production.up.railway.app/api https://qa-backend-qa-ae86.up.railway.app/api https://adaptable-quietude-staging.up.railway.app/api; do
            echo "================ $API"
            printf "health          → "; curl -sS -m 30 "$API/health" | head -c 260; echo
            printf "google challenge→ "; curl -sS -m 30 "$API/customer-auth/google/challenge" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const d=j.data||j;console.log(JSON.stringify({success:j.success,enabled:d.enabled,clientIdSet:!!d.clientId,clientIdSuffix:d.clientId?String(d.clientId).slice(-28):null,keys:Object.keys(d||{})}))}catch{console.log(s.slice(0,200))}})'
            printf "tracking code   → "; curl -sS -m 30 -X POST -H "Content-Type: application/json" -H "X-Requested-With: XMLHttpRequest" -H "Origin: https://nasaem-website-production.up.railway.app" --data '{"phone":"+249900000001"}' "$API/tracking/request-code" | head -c 300; echo
            printf "packages        → "; curl -sS -m 30 "$API/services/public/packages" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).data||[];console.log(r.length+" published: "+r.map(x=>x.code+":"+x.pricingMode+(x.basePrice?"="+x.basePrice+x.currency:"")).join(", "))}catch{console.log(s.slice(0,200))}})'
          done
      - name: Websites
        run: |
          for SITE in https://nasaem-website-production.up.railway.app https://nasaem-website-staging-staging.up.railway.app https://nasaem-alharamain.com; do
            echo "================ $SITE"
            for p in / /umrah /track /admin/login /account; do printf "%-14s → " "$p"; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "$SITE$p" || echo unreachable; done
          done
