name: Security lockfile refresh

on:
  push:
    branches:
      - security/nextjs-16.3.4

permissions:
  contents: write

jobs:
  refresh-web-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/nextjs-16.3.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate web lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore(web): refresh lockfile for Next.js 16.3.4"
          git push origin HEAD:security/nextjs-16.3.4
