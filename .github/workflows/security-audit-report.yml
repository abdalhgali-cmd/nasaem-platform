name: Security audit fix

on:
  push:
    branches:
      - security/nextjs-16.3.4

permissions:
  contents: write

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/nextjs-16.3.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply non-breaking npm audit fixes to lockfile
        working-directory: web
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify audit
        working-directory: web
        run: npm audit --omit=optional
      - name: Commit lockfile fix if needed
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "security(web): resolve transitive npm audit findings"
          git push origin HEAD:security/nextjs-16.3.4
