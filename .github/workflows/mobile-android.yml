name: Mobile Android

on:
  push:
    branches:
      - feature/nasaem-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: mobile/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stamp Android version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const file = "app.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.expo.android.versionCode = Number(process.env.BUILD_NUMBER);
          config.expo.version = `0.1.${process.env.BUILD_NUMBER}`;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          console.log("Android versionCode:", config.expo.android.versionCode);
          console.log("App version:", config.expo.version);
          NODE

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Restore stable debug signing key when configured
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable Android debug signing key restored."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. This APK is suitable for fresh installs, but updates over APKs signed on another runner are not guaranteed."
          fi

      - name: Build standalone release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: nasaem-android-standalone-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
